# SentiNET: `docker compose up -d --build`, then open http://localhost:8000
# Optional settings/keys: copy backend/.env.example to backend/.env (picked up if present).
services:
  sentinet:
    build: .
    image: sentinet:latest
    ports:
      # Loopback only: the API has no authentication. To reach it from other
      # machines, put an authenticating reverse proxy in front, or at least set
      # SENTINET_BIND=0.0.0.0 plus SENTINET_ALLOWED_HOSTS to the name you browse to.
      - "${SENTINET_BIND:-127.0.0.1}:${SENTINET_PORT:-8000}:8000"
    env_file:
      - path: backend/.env
        required: false
    environment:
      DATABASE_PATH: /data/sentinet.db # snapshots, watchlist and alerts survive rebuilds
    volumes:
      - sentinet-data:/data
    restart: unless-stopped

volumes:
  sentinet-data:
