<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="SentiNET — market-intelligence terminal: fused news, crowd, analyst, insider and filing sentiment for any ticker." />
    <meta name="theme-color" content="#0b0b0a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SentiNET — Market Intelligence</title>
    <script>
      // Apply the stored theme before first paint (no flash). Dark is the default.
      (function () {
        try {
          var t = localStorage.getItem("sentinet.theme");
          if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
